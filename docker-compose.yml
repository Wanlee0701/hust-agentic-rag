version: '3.8'

services:
  # ================================================================== #
  #  Chatbot Application (Streamlit + LangGraph)                        #
  # ================================================================== #
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-app
    ports:
      - "8501:8501"
    volumes:
      # Source PDFs — read-only, mount to rebuild KB inside container
      - ./knowledge_base:/app/knowledge_base:ro
      # Chroma DB + intermediate data — persisted across restarts
      - ./data:/app/data
      # Logs
      - ./logs:/app/logs
      # HuggingFace embedding model cache — avoids re-download on restart
      - hf_cache:/app/models
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/models
      # Override Ollama URL in config.yaml when using ollama profile
      # (config.yaml defaults to http://localhost:11434 which matches the ollama service)
    restart: unless-stopped
    networks:
      - chatbot-network

  # ================================================================== #
  #  Ollama LLM (optional — chỉ dùng khi provider='ollama')             #
  #  Kích hoạt: docker compose --profile ollama up                      #
  #  Sau đó pull model: docker exec ollama-service ollama pull llama3   #
  # ================================================================== #
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    networks:
      - chatbot-network

volumes:
  hf_cache:
    driver: local
  ollama_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
